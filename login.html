<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloomKids - Log In</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Bubblegum Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #e0c3fc, #8ec5fc);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            padding: 20px;
            color: #2d3436;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 4px dashed #4ecdc4;
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: transform 0.3s ease;
        }

        .auth-container:hover {
            transform: translateY(-5px);
        }

        @keyframes popUp {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .logo-area h1 {
            color: #4ecdc4;
            font-size: 2.5rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px #ffe66d;
            animation: float 3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .logo-area p {
            color: #ff6b6b;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3436;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 3px solid #dfe6e9;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background-color: #fff;
        }

        .form-group input:focus {
            border-color: #ff6b6b;
            box-shadow: 0 0 8px rgba(255, 107, 107, 0.4);
        }

        .btn-auth {
            background-color: #ffe66d;
            color: #2d3436;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 0 #f1c40f;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 10px;
        }

        .btn-auth:hover {
            background-color: #f1c40f;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #d4ac0d;
        }

        .btn-auth:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #f1c40f;
        }

        .footer-text {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #636e72;
        }

        .footer-text a {
            color: #4ecdc4;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s ease;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        .alert-msg {
            font-size: 0.85rem;
            margin-bottom: 15px;
            font-weight: bold;
            color: #d63031;
            display: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo-area">
            <h1>🌸 BloomKids</h1>
            <p>Welcome Back, Super Saver!</p>
        </div>

        <div id="login-error-alert" class="alert-msg"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="login-username">Your Cool Username:</label>
                <input type="text" id="login-username" placeholder="e.g. SamsungGuru" required>
            </div>

            <div class="form-group">
                <label for="login-password">Your Secret Password:</label>
                <input type="password" id="login-password" placeholder="Shhh... keep it secret!" required>
            </div>

            <button type="submit" class="btn-auth">Open My Savings Vault! 🚀</button>
        </form>

        <div class="footer-text">
            Don't have a savings account yet? <a href="signup.html">Sign up here</a>
        </div>
    </div>

    <script>
        // Check if user is already logged in
        const activeUser = localStorage.getItem('novaKidsActiveUser');
        if (activeUser) {
            window.location.href = 'index.html';
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim();
            const passwordInput = document.getElementById('login-password').value;
            const errorAlert = document.getElementById('login-error-alert');
            errorAlert.style.display = 'none';

            const users = JSON.parse(localStorage.getItem('novaKidsUsers')) || [];
            const foundUser = users.find(user => 
                user.username.toLowerCase() === usernameInput.toLowerCase() && user.password === passwordInput
            );

            if (foundUser) {
                localStorage.setItem('novaKidsActiveUser', foundUser.username);
                window.location.href = 'index.html';
            } else {
                errorAlert.textContent = "⚠️ Incorrect username or password. Try again!";
                errorAlert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
