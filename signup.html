<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join BloomKids! - Your Digital Savings Vault</title>
    <link rel="shortcut icon" href="../assets/logo.png" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Bubblegum Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffbcd1, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .signup-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 4px dashed #ff6b6b;
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: transform 0.3s ease;
        }

        .signup-container:hover {
            transform: translateY(-5px);
        }

        @keyframes popUp {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .logo-area h1 {
            color: #ff6b6b;
            font-size: 2.5rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px #ffe66d;
            animation: float 3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .logo-area p {
            color: #4ecdc4;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .form-step {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3436;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 3px solid #dfe6e9;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background-color: #fff;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #4ecdc4;
            box-shadow: 0 0 8px rgba(78, 205, 196, 0.4);
        }

        .btn-signup {
            background-color: #ffe66d;
            color: #2d3436;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 0 #f1c40f;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 10px;
        }

        .btn-signup:hover {
            background-color: #f1c40f;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #d4ac0d;
        }

        .btn-signup:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #f1c40f;
        }

        .error-msg {
            color: #d63031;
            font-size: 0.9rem;
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .footer-text {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #636e72;
        }

        .footer-text a {
            color: #ff6b6b;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s ease;
        }

        .footer-text a:hover {
            color: #4ecdc4;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="logo-area">
            <h1>🌸 BloomKids</h1>
            <p id="subtitle-text">Start Your Saving Adventure Today!</p>
        </div>

        <div id="error-alert" class="error-msg"></div>

        <form id="signup-form">
            <div id="step-1-fields" class="form-step">
                <div class="form-group">
                    <label for="username">Choose a Username:</label>
                    <input type="text" id="username" name="username" placeholder="e.g. SamsungGuru" required>
                </div>

                <div class="form-group">
                    <label for="parent-email">Parent's Email Address:</label>
                    <input type="email" id="parent-email" name="parent_email" placeholder="parent@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Create a Secret Password:</label>
                    <input type="password" id="password" name="password" placeholder="Shhh... keep it secret!" required>
                </div>
            </div>

            <div id="step-2-fields" class="form-step" style="display: none;">
                <div class="form-group">
                    <label for="fullname">What is your Full Name?</label>
                    <input type="text" id="fullname" name="fullname" placeholder="e.g. John Doe">
                </div>

                <div class="form-group">
                    <label for="age">How old are you?</label>
                    <input type="number" id="age" name="age" min="3" max="18" placeholder="e.g. 10">
                </div>

                <div class="form-group">
                    <label for="currency">Choose your favorite Currency:</label>
                    <select id="currency" name="currency">
                        <option value="USD">$ - US Dollar</option>
                        <option value="EUR">€ - Euro</option>
                        <option value="GBP">£ - British Pound</option>
                        <option value="NGN">₦ - Nigerian Naira</option>
                        <option value="CAD">$ - Canadian Dollar</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="btn-signup">Next Step! 🌟</button>
        </form>

        <div class="footer-text">
            Already have a savings account? <a href="../LogIn/index.html">Log in here</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('signup-form');
        const step1Fields = document.getElementById('step-1-fields');
        const step2Fields = document.getElementById('step-2-fields');
        const subtitleText = document.getElementById('subtitle-text');
        const submitBtn = document.getElementById('submit-btn');
        const errorAlert = document.getElementById('error-alert');

        let currentStep = 1;

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            errorAlert.style.display = 'none';

            if (currentStep === 1) {
                const usernameInput = document.getElementById('username').value.trim();
                
                let registeredUsers = JSON.parse(localStorage.getItem('novaKidsUsers')) || [];
                const userExists = registeredUsers.some(user => user.username.toLowerCase() === usernameInput.toLowerCase());

                if (userExists) {
                    errorAlert.textContent = "⚠️ That username is already registered! Please pick another one.";
                    errorAlert.style.display = 'block';
                    return;
                }

                step1Fields.style.display = 'none';
                step2Fields.style.display = 'block';
                subtitleText.textContent = "Tell us a little bit about yourself!";
                submitBtn.textContent = "Create My Savings Vault! 🚀";
                currentStep = 2;

            } else {
                const username = document.getElementById('username').value.trim();
                const parentEmail = document.getElementById('parent-email').value.trim();
                const password = document.getElementById('password').value;
                const fullname = document.getElementById('fullname').value.trim();
                const age = document.getElementById('age').value;
                const currency = document.getElementById('currency').value;

                let registeredUsers = JSON.parse(localStorage.getItem('novaKidsUsers')) || [];
                
                registeredUsers.push({
                    username: username,
                    parentEmail: parentEmail,
                    password: password,
                    fullname: fullname,
                    age: age,
                    currency: currency,
                    balance: 0,
                    transactions: [],
                    debts: []
                });

                localStorage.setItem('novaKidsUsers', JSON.stringify(registeredUsers));

                alert("🎉 Hooray! Your BloomKids Savings Vault has been created!");
                window.location.href = "../LogIn/index.html";
            }
        });
    </script>
</body>
</html>
